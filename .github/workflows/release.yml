name: Release Please

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, milestoned, demilestoned, closed]
    branches: [master]

permissions:
  contents: read

jobs:
  version-policy:
    if: github.event.action != 'closed'
    permissions:
      contents: read
      pull-requests: read
    uses: aplicacoesBoilerplate/.github/.github/workflows/version-release-please-validate.yml@080df5aa1c803252ba91fa00ac529fc5e2006c47
    with:
      config-file: release-please-config.json
      project-path: .
      central-ref: 080df5aa1c803252ba91fa00ac529fc5e2006c47

  validate:
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/ci.yml

  release:
    if: github.event.pull_request.merged == true
    needs: validate
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: aplicacoesBoilerplate/.github/.github/workflows/version-release-please-called.yml@080df5aa1c803252ba91fa00ac529fc5e2006c47
    with:
      project-type: node
      central-ref: 080df5aa1c803252ba91fa00ac529fc5e2006c47
      publish-artifacts: false
      project-path: .
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
