name: Build documentation

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/docs-deploy.yml'
      - 'apps/docs/**'
      - 'packages/ui/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run build --workspace @aplicacoesboilerplate/docs

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: apps/docs/.vitepress/dist
          retention-days: 14
