name: Documentação
on:
  pull_request:
    paths: ['apps/docs/**', 'packages/**', 'tools/docs/**', 'package.json', 'package-lock.json', 'turbo.json', 'release-please-config.json', '.github/workflows/docs-deploy.yml']
  push:
    branches: [master]
    paths: ['apps/docs/**', 'packages/**', 'tools/docs/**', 'package.json', 'package-lock.json', 'turbo.json', 'release-please-config.json', '.github/workflows/docs-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  documentation:
    uses: aplicacoesBoilerplate/.github/.github/workflows/documentacao-pages.yml@080df5aa1c803252ba91fa00ac529fc5e2006c47
    with:
      docs-dir: apps/docs
      install-dir: .
      build-script: build
      npm-version: '10.9.4'
