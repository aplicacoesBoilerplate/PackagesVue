name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require changeset for package changes
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed_files="$(git diff --name-only "origin/${BASE_REF}"...HEAD)"
          package_changed="$(printf '%s\n' "$changed_files" | grep -E '^packages/[^/]+/' || true)"
          changeset_added="$(printf '%s\n' "$changed_files" | grep -E '^\.changeset/.+\.md$' || true)"
          if [ -n "$package_changed" ] && [ -z "$changeset_added" ]; then
            echo "Alterações em pacotes publicáveis exigem um changeset. Execute: npm run changeset"
            exit 1
          fi

      - name: Verify monorepo
        run: npm run verify
