name: CI

on:
  workflow_call:
  pull_request:
    branches: [master, develop, 'release/**']
  push:
    branches: [master, develop, 'release/**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Pin npm required by devEngines
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@10.9.4 --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Verify monorepo
        run: npm run verify
